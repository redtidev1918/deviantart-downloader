name: Release

# Tag-driven release: push a tag like v4.0.1 and this workflow builds the
# distributions, creates the GitHub Release, and publishes to PyPI via OIDC.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and release tools
        run: pip install ".[dev]" build twine
      - name: Ruff check
        run: ruff check .
      - name: Test
        run: pytest -m "not integration" -q
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine metadata check
        run: twine check dist/*
      - name: Verify tag matches package version
        run: |
          PKG_VERSION="v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "package: ${PKG_VERSION}, tag: ${GITHUB_REF_NAME}"
          test "${PKG_VERSION}" = "${GITHUB_REF_NAME}" || {
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${PKG_VERSION}"
            exit 1
          }
      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/devart-dl version
          /tmp/smoke/bin/devart-dl --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract changelog section for this tag
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{if (flag) exit} flag" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog section found for ${VERSION}; using generated notes."
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: devart-dl ${{ github.ref_name }}
          body_path: release_notes.md
          generate_release_notes: ${{ steps.notes.outputs.generated == 'true' }}
          files: dist/*
          fail_on_unmatched_files: true

  # PyPI Trusted Publishing (OIDC): no API token stored anywhere.
  # One-time setup on PyPI (project owner):
  #   pypi.org -> Manage project devart-dl -> Publishing (Trusted Publisher)
  #   Owner: redtidev1918  Repository: deviantart-downloader
  #   Workflow: release.yml  Environment: pypi
  # Until that is configured, this job fails on the OIDC exchange while the
  # GitHub Release above still publishes normally.
  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI to verify this workflow via OIDC.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  cleanup-releases:
    name: Keep only latest GitHub Release
    needs: [github-release, pypi-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Delete older Release entries (keep tags)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | [.id, .tag_name] | @tsv' |
          while IFS=$'\t' read -r id tag; do
            if [ "${tag}" != "${GITHUB_REF_NAME}" ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            fi
          done
