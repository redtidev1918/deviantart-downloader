name: Release

# 全自动发版，无需任何 PAT/secret：
# - main 上合入 feat/fix 等 release-worthy 提交后，release-please job 自动开/更发版 PR；
# - 发版 PR 合并后，同一个 workflow run 内 release-please 推 tag，后续 build/release/pypi
#   job 直接在本 run 内运行（不依赖 "tag push 触发新工作流"——内置 GITHUB_TOKEN 推的 tag
#   不会触发其他工作流，但同一 run 内的 job 不受此限制）。
# - 仍支持手动推 v* tag / workflow_dispatch 重跑（release-please 不在这两种场景运行）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要重跑/重发布的已有 tag（如 v4.1.2）；main push 自动发版时忽略此输入
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Release Please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build distributions
    needs: release-please
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' && needs.release-please.outputs.releases_created == 'true' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and release tools
        run: pip install ".[dev]" build twine
      - name: Ruff check
        run: ruff check .
      - name: Test
        run: pytest -m "not integration" -q
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine metadata check
        run: twine check dist/*
      - name: Verify tag matches package version
        run: |
          PKG_VERSION="v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "package: ${PKG_VERSION}, tag: ${RELEASE_TAG}"
          test "${PKG_VERSION}" = "${RELEASE_TAG}" || {
            echo "::error::Tag ${RELEASE_TAG} does not match package version ${PKG_VERSION}"
            exit 1
          }
      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/devart-dl version
          /tmp/smoke/bin/devart-dl --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30

  github-release:
    name: Create GitHub Release
    needs: [release-please, build]
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' && needs.release-please.outputs.releases_created == 'true' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract changelog section for this tag
        id: notes
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{if (flag) exit} flag" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog section found for ${VERSION}; using generated notes."
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: devart-dl ${{ env.RELEASE_TAG }}
          body_path: release_notes.md
          generate_release_notes: ${{ steps.notes.outputs.generated == 'true' }}
          files: dist/*
          fail_on_unmatched_files: true

  # PyPI Trusted Publishing (OIDC): no API token stored anywhere.
  # One-time setup on PyPI (project owner):
  #   pypi.org -> Manage project devart-dl -> Publishing (Trusted Publisher)
  #   Owner: redtidev1918  Repository: deviantart-downloader
  #   Workflow: release.yml  Environment: pypi
  pypi-publish:
    name: Publish to PyPI
    needs: [release-please, build]
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' && needs.release-please.outputs.releases_created == 'true' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI to verify this workflow via OIDC.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # 发版后自动更新下载页并部署 Pages——必须在同一 run 内完成：
  # release:published 事件和后续 main push 都不会触发新工作流（GITHUB_TOKEN 限制）。
  download-page:
    name: Update download page and deploy Pages
    needs: [release-please, github-release]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Generate docs/download.md from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_download_page.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/download.md
          if git diff --cached --quiet; then
            echo "download page unchanged"
          else
            git commit -m "docs: 自动更新下载页（指向最新 Release）"
            git pull --rebase origin main || true
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  cleanup-releases:
    name: Keep only latest GitHub Release
    needs: [github-release, pypi-publish]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref_name }}
    steps:
      - name: Delete older Release entries (keep tags)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | [.id, .tag_name] | @tsv' |
          while IFS=$'\t' read -r id tag; do
            if [ "${tag}" != "${RELEASE_TAG}" ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            fi
          done
